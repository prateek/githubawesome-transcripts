[project]
name = "githubawesome-transcripts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default]>=2026.10.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
