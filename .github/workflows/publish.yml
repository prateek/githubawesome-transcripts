name: Collect and publish
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: Standard hosted runner for caption collection
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
      verify_model:
        description: Verify the free model using a synthetic transcript
        type: boolean
        default: false
      max_videos:
        description: Maximum caption attempts for this run
        type: number
        default: 10
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: read
concurrency:
  group: archive-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - name: Verify free model access
        if: inputs.verify_model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python scripts/verify_model.py
      - name: Discover and retrieve captions
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MAX_VIDEOS: ${{ inputs.max_videos || 10 }}
        run: uv run python -m archive sync --max-videos "$MAX_VIDEOS" --delay 15
      - name: Copy-edit using free models
        id: clean
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python -m archive clean --max-videos 5
      - name: Commit dataset and request budget
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update transcript archive'
            git push origin HEAD:main
          fi
      - name: Build static archive
        run: uv run python -m archive build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Report collection failures
        if: steps.collect.outcome == 'failure' || steps.clean.outcome == 'failure'
        run: echo '::warning::Collection or editing failed. The existing archive was preserved; inspect the step logs.'
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
