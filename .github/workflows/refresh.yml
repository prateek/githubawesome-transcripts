name: Refresh GitHub data
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --locked
      - name: Refresh repository data and record a star snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m scripts.refresh_github_stats
      - name: Commit the refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github.json data/stars
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
