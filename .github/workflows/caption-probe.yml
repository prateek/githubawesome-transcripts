name: Hosted caption probe
on:
  push:
    branches: [caption-probe]
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - run: python3 scripts/probe-runtime/camofox-runtime.py install
      - run: uv run python -m scripts.caption_probe
